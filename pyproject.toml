[project]
name = "demae"
version = "0.1.0"
description = "DEMAE — a ViT-MAE foundation model for terrain. Phase 0: reproducible DEM data pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Jonathan Stoschek" }]

# Core geospatial stack for the Phase-0 data pipeline.
# rasterio ships manylinux/macos wheels with GDAL bundled, so no system GDAL is
# required (see CONTEXT.md → Environment). COG windowed reads from the public
# Copernicus bucket go through GDAL's /vsis3/ with anonymous access.
dependencies = [
    "rasterio>=1.4,<2",
    "numpy>=2.0,<3",
    "pyproj>=3.6,<4",
    "boto3>=1.35",          # anonymous bucket listing / STAC-adjacent discovery
    "pyarrow>=16",          # Parquet tile-manifest (ADR 0002)
    "tqdm>=4.66",           # build-CLI progress bars over the long scan/materialize
    # Phase-D stratifier (#41): fits the k=20 stratum centroids. Pinned to a minor
    # series — sklearn does not guarantee KMeans output across minors, and the shipped
    # centroids artifact records the exact version it was fit with. Only `fit_centroids`
    # imports it; the reproducible read/assign path is pure NumPy.
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
# The Phase-1 pretraining package's runtime (issue #89, plan §1). An *extra*, not a core
# dependency: `src/dataset` — the ETL core — stays lean and torch-free (ADR-0003 keeps
# `dataset.loader`'s torch import lazy for exactly this reason), so `pip install demae`
# still builds a corpus on a box with no CUDA stack. `pip install demae[pretrain]` is what
# the rented training box installs. timm supplies the Apache-2.0 ViT blocks the model is
# ported onto; the official `facebookresearch/mae` repo is spec only (plan §1: frozen on
# timm 0.3.2, documented fp16 NaNs, CC-BY-NC).
pretrain = [
    "torch>=2.2",
    "timm>=1.0",
    # The §11 metrics sink (#97). A runtime dependency of the training package rather than a
    # dev extra, because a run with no sink records nothing off-instance and §11's whole point
    # is that the box holds nothing unique. It is installed for its **offline** mode: the
    # logging path is exercised with no account and no network (`monitoring.wandb_mode`), which
    # is what keeps #97 off the critical path of #80's ops provisioning.
    "wandb>=0.17",
]
# The TerraMind half of ADR-0012's extractor contract (issue #157, plan §2.1/§9.4). A5 and A9
# read `terratorch`'s DEM tokenizer encoder, and the contract's `terramind_v1` diet is selected
# by the *named* `v1_pretraining_mean/std["tok_dem@224"]` lookup — so the benchmark environment
# has to hold the package, not just a record of one.
#
# This reverses `scripts/p118_terramind_probe.py`'s "must not become a project dependency", and
# the reason it can is that it is an **extra**: `pip install demae` still builds a corpus on a
# box with no CUDA stack, and `pip install demae[pretrain]` is still what the training box
# installs. What p118 measured — 113 packages / 405 MB, and `numpy>=2.2` / `timm>=1.0.15` floors
# sitting close to DEMAE's own — is an argument against putting it in the *core*, which this
# does not.
#
# **Both versions are exact pins, and the `diffusers` one is the point.** terratorch declares a
# bare `diffusers` (p118 §4: the `==0.30.0` in its warning text is remediation advice, not a
# constraint), so with a range here a future diffusers release breaks the tokenizer import with
# no lockfile signal at all. 1.2.10 / 0.39.0 is the pair the TerraMind path is *verified* on —
# p118's run and #157's — and moving either is a deliberate re-verification.
terramind = [
    "terratorch==1.2.10",
    "diffusers==0.39.0",
]

[dependency-groups]
# Dev-only; kept out of the runtime pipeline so the reproducible core stays lean.
dev = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    # Arrives transitively under matplotlib, but the E2.4 gallery driver imports it
    # directly to write the non-gating sheets as WebP, so it is declared directly too.
    "pillow>=10.0",
    "ipykernel>=6.29",
    "pytest>=8.2",
    # The suite is ~1600 tests and the gate before every push, so it runs sharded by
    # default (see `addopts`). Nothing in it shares mutable state across tests — every
    # write goes to a `tmp_path` — so the only cost of sharding is the process spawn.
    "pytest-xdist>=3.8",
    # Same story as pillow: arrives transitively under scikit-learn, but the P77 split
    # driver imports `scipy.spatial.cKDTree` directly to measure train-to-hold-out
    # distances, so it is declared directly too.
    "scipy>=1.13",
    # The live pytest suite covers both packages, so the dev environment carries the
    # pretraining extra. Torch used to sit here in its own right (for the `dataset.loader`
    # test); #89 makes it a declared runtime dependency of `pretrain`, and this line is
    # what keeps a plain `uv sync` still installing it.
    "demae[pretrain]",
    # Same story one artifact along (#157): the live suite now covers the TerraMind half of
    # ADR-0012's contract, and a `benchmark.extract` test that skips because terratorch is
    # absent is a contract clause shipped unexercised. The 405 MB lands in the *dev* group and
    # nowhere else — the ETL box installs neither this nor `pretrain`.
    "demae[terramind]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto` takes the suite from 4:45 to under 2:00 on an 8-core box. The floor is the longest
# single test chain (§15.4's kill-and-resume gate, ~40s), not the worker count, so `auto`
# is as good as any hand-picked number here. Override with `-n0` when a failure needs a
# readable traceback or `--pdb` — xdist disables the debugger.
addopts = "-q -n auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset", "src/pretrain", "src/benchmark"]
