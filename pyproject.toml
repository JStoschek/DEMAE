[project]
name = "demae"
version = "0.1.0"
description = "DEMAE — a ViT-MAE foundation model for terrain. Phase 0: reproducible DEM data pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Jonathan Stoschek" }]

# Core geospatial stack for the Phase-0 data pipeline.
# rasterio ships manylinux/macos wheels with GDAL bundled, so no system GDAL is
# required (see CONTEXT.md → Environment). COG windowed reads from the public
# Copernicus bucket go through GDAL's /vsis3/ with anonymous access.
dependencies = [
    "rasterio>=1.4,<2",
    "numpy>=2.0,<3",
    "pyproj>=3.6,<4",
    "boto3>=1.35",          # anonymous bucket listing / STAC-adjacent discovery
    "pyarrow>=16",          # Parquet tile-manifest (ADR 0002)
    "tqdm>=4.66",           # build-CLI progress bars over the long scan/materialize
    # Phase-D stratifier (#41): fits the k=20 stratum centroids. Pinned to a minor
    # series — sklearn does not guarantee KMeans output across minors, and the shipped
    # centroids artifact records the exact version it was fit with. Only `fit_centroids`
    # imports it; the reproducible read/assign path is pure NumPy.
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
# The Phase-1 pretraining package's runtime (issue #89, plan §1). An *extra*, not a core
# dependency: `src/dataset` — the ETL core — stays lean and torch-free (ADR-0003 keeps
# `dataset.loader`'s torch import lazy for exactly this reason), so `pip install demae`
# still builds a corpus on a box with no CUDA stack. `pip install demae[pretrain]` is what
# the rented training box installs. timm supplies the Apache-2.0 ViT blocks the model is
# ported onto; the official `facebookresearch/mae` repo is spec only (plan §1: frozen on
# timm 0.3.2, documented fp16 NaNs, CC-BY-NC).
pretrain = [
    "torch>=2.2",
    "timm>=1.0",
    # The §11 metrics sink (#97). A runtime dependency of the training package rather than a
    # dev extra, because a run with no sink records nothing off-instance and §11's whole point
    # is that the box holds nothing unique. It is installed for its **offline** mode: the
    # logging path is exercised with no account and no network (`monitoring.wandb_mode`), which
    # is what keeps #97 off the critical path of #80's ops provisioning.
    "wandb>=0.17",
]

[dependency-groups]
# Dev-only; kept out of the runtime pipeline so the reproducible core stays lean.
dev = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    # Arrives transitively under matplotlib, but the E2.4 gallery driver imports it
    # directly to write the non-gating sheets as WebP, so it is declared directly too.
    "pillow>=10.0",
    "ipykernel>=6.29",
    "pytest>=8.2",
    # Same story as pillow: arrives transitively under scikit-learn, but the P77 split
    # driver imports `scipy.spatial.cKDTree` directly to measure train-to-hold-out
    # distances, so it is declared directly too.
    "scipy>=1.13",
    # The live pytest suite covers both packages, so the dev environment carries the
    # pretraining extra. Torch used to sit here in its own right (for the `dataset.loader`
    # test); #89 makes it a declared runtime dependency of `pretrain`, and this line is
    # what keeps a plain `uv sync` still installing it.
    "demae[pretrain]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset", "src/pretrain"]
